[package]
name = "barcelona"
version = "0.1.0"
edition = "2021"
authors = ["Metrica Sports"]
description = "Smol & efficient football possession detection from tracking data"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
csv = "1.3"

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[[bin]]
name = "barcelona"
path = "src/main.rs"
